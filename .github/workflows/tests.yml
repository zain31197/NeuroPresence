# Every push and pull request runs the project's tests on a clean machine, the way a new member would set it up.
#
# The machines have no graphics card and none of the downloaded models (models/, third_party/ and data/ are not in
# git), so the tests that need the GPU or a model skip themselves and say why (-rs); everything else runs. The engine
# tests run on Linux, the Kubuntu side, and on Windows, the demo side. GPU-only packages are left out: PyTorch is
# installed in its CPU build, onnxruntime in place of onnxruntime-gpu, and TensorRT and Triton not at all, which is
# what the app itself falls back to without them.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine and server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        # PortAudio for the microphone code, and the OpenGL libraries OpenCV and MediaPipe load.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libegl1

      - name: Python packages, CPU only
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          grep -v -E '^(tensorrt|onnxruntime-gpu|triton)' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt onnxruntime==1.30.0

      - name: Tests
        run: python -m pytest -q -rs

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
